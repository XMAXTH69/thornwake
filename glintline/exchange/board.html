<!doctype html>
<html><head><meta charset="utf-8"><title>Glint Exchange board</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap">
<style>
/* Glintline Exchange board (24 Nov 2026). ONE page for ONE media channel: BOARD = top 960 px (2:1), TICKER STRIP = bottom 120 px (16:1); the glb quads crop v 0.111..1 and v 0..0.111. LOCAL draft, nothing published. Palette E: petrol panels, amber text. 1920x1080 stage scaled to the window.
   Draws ONLY what the URL fragment gives it; no secrets, salts or seeds are read or kept here. */
:root{--bg:#04161a;--bg2:#0a3a40;--pan:#082A2F;--line:#14565c;--tickbg:#020c0e;--amb:#FFB02E;--gold:#FFCF6A;--txt:#fff;--up:#3cebb0;--dn:#ff5a5a;--dim:#7fa3a6}  /* ONE palette block: the broker palette (owner pick) replaces these values only */
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Cinzel',Georgia,serif}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:radial-gradient(ellipse at 50% 0,var(--bg2),var(--bg) 70%);color:var(--gold)}
.hd{position:absolute;left:40px;right:40px;top:24px;height:110px;display:flex;align-items:center;justify-content:space-between;border-bottom:4px solid var(--amb)}
.hd h1{margin:0;font-size:78px;letter-spacing:10px;color:var(--amb);font-weight:700}
.hd .sub{font-size:34px;color:var(--gold);letter-spacing:4px;text-align:right;line-height:1.25}
#demo{display:none;position:absolute;left:760px;top:34px;font:700 44px 'Cinzel',serif;color:var(--bg);background:var(--amb);padding:4px 26px;border-radius:6px;letter-spacing:8px;z-index:5;animation:bl 1.6s steps(2) infinite}
.grid{position:absolute;left:40px;top:150px;width:1300px;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.row{position:relative;height:100px;background:var(--pan);border:2px solid var(--line);border-radius:10px;display:grid;grid-template-columns:130px 120px 50px 130px 1fr;align-items:center;padding:0 12px;font-size:40px}
.nm{color:var(--gold);font-weight:700;letter-spacing:3px}.pr{color:var(--txt);text-align:right;font-variant-numeric:tabular-nums}
.ar{text-align:center;font-size:34px}.ch{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}.ar.up,.ar.dn{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.sp{height:60px;width:100%;padding-left:10px;box-sizing:border-box}
.chip{position:absolute;right:8px;top:4px;font-size:16px;letter-spacing:2px;padding:0 8px;border-radius:4px;color:var(--bg);font-weight:700}
.side{position:absolute;left:1370px;top:150px;width:510px}
.card{background:var(--pan);border:2px solid var(--line);border-radius:12px;padding:20px 26px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:36px;letter-spacing:5px;color:var(--amb);border-bottom:3px solid var(--amb);padding-bottom:8px}
.er{display:flex;justify-content:space-between;font-size:36px;margin:6px 0;color:var(--gold)}.er b{color:var(--txt);font-variant-numeric:tabular-nums}
.lr{display:grid;grid-template-columns:44px 1fr auto;font-size:30px;margin:4px 0;color:var(--gold)}.lr b{font-variant-numeric:tabular-nums}.lr i{font-style:normal;color:var(--dim)}
.note{font-size:26px;color:var(--dim);letter-spacing:1px;line-height:1.3}
.key{font-size:28px;line-height:1.6}.key i{display:inline-block;width:22px;height:22px;border-radius:4px;margin-right:12px;vertical-align:-3px}
.tick{box-sizing:border-box;position:absolute;left:0;right:0;bottom:0;height:120px;background:var(--tickbg);border-top:4px solid var(--amb);overflow:hidden;white-space:nowrap}
.tick .in{display:inline-block;padding-left:100%;animation:sc 60s linear infinite;line-height:120px;font-size:56px;font-weight:700}
.tick span{margin-right:70px;color:var(--gold)}.tick em{font-style:normal;margin-left:14px}
@keyframes sc{to{transform:translateX(-100%)}}
</style></head>
<body><div id="stage">
<div class="hd"><h1>GLINT EXCHANGE</h1><div class="sub">BROKER BOARD<br><span id="asof"></span></div></div>
<div id="demo">DEMO</div>
<div class="grid" id="grid"></div>
<div class="side">
 <div class="card"><h2>BROKER EARNINGS</h2>
  <div class="er">TODAY <b id="e1">-</b></div><div class="er">THIS WEEK <b id="e2">-</b></div><div class="er">ALL TIME <b id="e3">-</b></div>
  <div class="note">glint the broker took in fees</div></div>
 <div class="card"><h2>TOP TRADERS</h2><div id="lb"></div>
  <div class="note">profit right now, all time</div></div>
 <div class="note" style="padding:0 10px">GLINT ONLY - NO REAL MONEY</div>
</div>
<div class="tick"><div class="in" id="tk"></div></div>
</div>
<script>
// URL fragment: #t=<unix seconds>&p=NAME:price:change%:rating,NAME:...&e=today:week:alltime&l=NAME~profit,NAME~profit,... (top 5)
// rating = BROKER RATING 0-100 (GLINT-EXCHANGE.md s2): 80+ CALM, 50-79 BUMPY, below 50 WILD. l = all-time traders by CURRENT net profit (equity - glint moved in), may be negative.
// No fragment -> DEMO with a visible DEMO tag. The page only draws what it is given. Sparklines are decoration drawn from name, change and t only.
var DEMO_P = 'TYRE:6.15:+1.2:38,GLNT:8.40:+0.6:65,WRNC:9.10:-0.8:52,VOLT:12.30:+2.1:29,NITE:14.10:-0.4:70,GLTV:15.20:+0.2:56,MEDX:18.00:-1.5:45,SAFE:20.10:+0.1:88,KERB:22.40:+0.9:62,ECHO:25.30:-2.2:52,PETR:35.00:+0.3:75,NULL:40.60:-1.1:58,AURM:45.20:+1.8:66,HALO:60.10:+0.5:80';
var DEMO_E = '4210:31800:155200';
var DEMO_L = 'Wheelwright~18420,NightOwl~9310,Kerbside~4075,AurumFan~-1200,Lucky7~-6800';
function parse() {
  var h = location.hash.replace(/^#/, ''), q = {}, demo = false;
  h.split('&').forEach(function (kv) { var i = kv.indexOf('='); if (i > 0) q[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1)); });
  if (!q.p) { demo = true; q.p = DEMO_P; q.e = q.e || DEMO_E; q.l = q.l || DEMO_L; q.t = q.t || String(Math.floor(Date.now() / 1000)); }
  var rows = q.p.split(',').slice(0, 14).map(function (s) { var a = s.split(':'); return { n: (a[0] || '?').slice(0, 5), p: parseFloat(a[1]), c: parseFloat(a[2]), r: parseFloat(a[3]) }; }).filter(function (r) { return !isNaN(r.p); });
  var lb = (q.l || '').split(',').slice(0, 5).map(function (s) { var a = s.split('~'); return { n: (a[0] || '').slice(0, 14), v: parseFloat(a[1]) }; }).filter(function (x) { return x.n && !isNaN(x.v); });
  return { demo: demo, t: parseInt(q.t, 10) || 0, rows: rows, e: (q.e || '').split(':'), lb: lb };
}
var C = (function () { var cs = getComputedStyle(document.documentElement), o = {}; ['up', 'dn', 'amb'].forEach(function (k) { o[k] = cs.getPropertyValue('--' + k).trim(); }); return o; })();
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function fmt(n) { n = parseFloat(n); return isNaN(n) ? '-' : Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
function hash(s) { var h = 7; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 100003; return h; }
function spark(r, t) {
  var pts = [], v = 0.5, sd = hash(r.n) + (t % 100000), up = r.c >= 0;
  for (var i = 0; i < 16; i++) { sd = (sd * 1103 + 12345) % 100003; v = Math.min(0.95, Math.max(0.05, v + ((sd % 100) / 100 - 0.5) * 0.35 + (up ? 0.03 : -0.03))); pts.push(v); }
  var w = 360, h = 60, d = pts.map(function (y, i) { return (i ? 'L' : 'M') + (i * w / 15).toFixed(1) + ' ' + (h - y * h).toFixed(1); }).join('');
  return '<svg class="sp" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none"><path d="' + d + '" fill="none" stroke="' + (up ? C.up : C.dn) + '" stroke-width="4" stroke-linejoin="round"/></svg>';
}
function chip(r) { var c = isNaN(r.r) ? null : (r.r >= 80 ? ['CALM', C.up] : r.r >= 50 ? ['BUMPY', C.amb] : ['WILD', C.dn]); return c ? '<div class="chip" style="background:' + c[1] + '">' + c[0] + ' ' + Math.round(r.r) + '</div>' : ''; }
function draw() {
  var d = parse(); document.getElementById('demo').style.display = d.demo ? 'block' : 'none';
  var html = '', tk = '';
  d.rows.forEach(function (r) {
    var up = r.c >= 0, cls = up ? 'up' : 'dn', ch = (up ? '+' : '') + (isNaN(r.c) ? '0.0' : r.c.toFixed(1)) + '%';
    html += '<div class="row"><div class="nm">' + esc(r.n) + '</div><div class="pr">' + r.p.toFixed(2) + '</div><div class="ar ' + cls + '">' + (up ? '&#9650;' : '&#9660;') + '</div><div class="ch ' + cls + '">' + ch + '</div>' + spark(r, d.t) + chip(r) + '</div>';
    tk += '<span>' + esc(r.n) + ' ' + r.p.toFixed(2) + '<em class="' + cls + '">' + (up ? '&#9650;' : '&#9660;') + ' ' + ch + '</em></span>';
  });
  document.getElementById('grid').innerHTML = html; document.getElementById('tk').innerHTML = tk + tk;
  document.getElementById('e1').textContent = fmt(d.e[0]); document.getElementById('e2').textContent = fmt(d.e[1]); document.getElementById('e3').textContent = fmt(d.e[2]);
  document.getElementById('lb').innerHTML = d.lb.length ? d.lb.map(function (x, i) { var up = x.v >= 0; return '<div class="lr"><i>' + (i + 1) + '</i><span>' + esc(x.n) + '</span><b class="' + (up ? 'up' : 'dn') + '">' + (up ? '+' : '-') + fmt(Math.abs(x.v)) + '</b></div>'; }).join('') : '<div class="note">no traders yet</div>';
  var as = document.getElementById('asof'); if (d.t) { var x = new Date(d.t * 1000); as.textContent = ('0' + x.getHours()).slice(-2) + ':' + ('0' + x.getMinutes()).slice(-2); } else as.textContent = '';
}
function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080), st = document.getElementById('stage'); st.style.transform = 'scale(' + s + ')'; st.style.left = (innerWidth - 1920 * s) / 2 + 'px'; st.style.top = (innerHeight - 1080 * s) / 2 + 'px'; }
addEventListener('resize', fit); addEventListener('hashchange', draw); fit(); draw();
</script></body></html>
