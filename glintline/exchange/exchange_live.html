<html><head><meta charset="utf-8"><title>Glint Exchange (live)</title>

   px   50 prices in CENTS, board order   pv 50 prices 24 h ago (cents)   sel highlighted row (market: stock id; portfolio: row in the FILTERED list, see exchange_portfolio.js)

   r    ok|kind|qty|glint|fee|text   (kind buy|sell|in|out; text URL-encoded; on ok results text = optional result line, e.g. "+12 glint result")
   pz   1 = MARKET PAUSED (the price script waits for the game-link numbers): amber strip on every page + text on the wait page; 0/missing = normal
   mf   market SORT 0 ALL | 1 SECTOR | 2 STOCK TYPE | 3 CATEGORY (26 Nov; bar slot 4 SORT = key 3; order = ORDER[] = GlintBroker SortOrder)
   f    fee per order (default 5)   n send counter (ignored)   unknown keys ignored.   ?demo=1 = fake state + clickable buttons/keys + chat box (/buy 50 /sell all /in 500 /out all).   ?dbg=1 = counter. */
@font-face{font-family:Brand;src:url(../kiosk/live/fonts/Cinzel.ttf);font-weight:400 900}
@font-face{font-family:UI;src:url(../kiosk/live/fonts/BarlowSemiCondensed-Bold.ttf)}
:root{--bg:#070C18;--bg2:#16264A;--pan:#101A33;--line:#2C3E66;--tick:#04070F;--acc:#7FD4FF;--lab:#DCE3EE;--txt:#fff;--up:#2EE59D;--dn:#FF4F64;--dim:#8C9AB5;--amb:#FFB02E}
html,body{margin:0;width:100%;height:100%;background:#04070F;overflow:hidden;position:fixed;left:0;top:0;right:0;bottom:0}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;contain:paint;background:var(--bg);font-family:UI,'Segoe UI',Arial,sans-serif;color:var(--txt)}
#stage::before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;background:radial-gradient(ellipse 70% 70% at 50% 40%,#16264A55,transparent 70%)}
.a{position:absolute;white-space:nowrap}
.r{text-align:right}.c{text-align:center}
.dim{color:var(--dim)}.lab{color:var(--lab)}.up{color:var(--up)}.dn{color:var(--dn)}.amb{color:var(--amb)}.acc{color:var(--acc)}
.brand{font-family:Brand,serif;font-weight:700;letter-spacing:.3em;font-size:36px;color:var(--acc)}
.panel{background:var(--pan);border:2px solid var(--line);border-radius:18px;box-sizing:border-box}
.row{height:44px;line-height:44px;font-size:28px}
.chip{height:38px;line-height:38px;border-radius:6px;color:#04070F;text-align:center;font-size:28px}
.btn{width:260px;height:110px;top:940px;box-sizing:border-box;border-radius:20px;background:var(--bg2);border:3px solid var(--acc);color:var(--acc);font-size:38px;display:flex;align-items:center;justify-content:center;white-space:nowrap;position:absolute;padding:0 16px}
.btn.off{background:transparent;border:3px dashed #2C3E6688;color:transparent}
.btn.soon{opacity:.45;border-color:var(--line);color:var(--dim)}
/* 26 Nov owner: touchable = PULSING glow (no sweeping lines). MAIN action (right slot) = filled accent; off / soon = still. Selected row = colour highlight only, no motion. */
.btn{overflow:hidden}
.btn.main{background:var(--acc);color:#04070F}
.btn::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;animation:xbreathe 2.6s ease-in-out infinite}
.btn.main::before,.btn.g::before,.btn.rd::before{animation:xbreathe2 2.6s ease-in-out infinite}
@keyframes xbreathe2{0%,100%{box-shadow:inset 0 0 0 rgba(255,255,255,0)}50%{box-shadow:inset 0 0 30px rgba(255,255,255,.60)}}
@keyframes xbreathe{0%,100%{box-shadow:inset 0 0 0 rgba(127,212,255,0)}50%{box-shadow:inset 0 0 24px rgba(127,212,255,.40)}}
.btn.off::before,.btn.soon::before{display:none}
.btn.g{background:var(--up);color:#04070F;border-color:var(--up)}.btn.rd{background:var(--dn);color:#04070F;border-color:var(--dn)}
.demo .btn:not(.off){cursor:pointer}.demo .btn:not(.off):hover{filter:brightness(1.25)}
.spin{width:110px;height:110px;border-radius:50%;border:12px solid #2C3E66;border-top-color:var(--acc);animation:sp .9s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pulse{animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{opacity:.55}}
#dlg{position:absolute;left:600px;top:330px;width:720px;height:360px;background:#20242C;border-top:8px solid var(--acc);box-shadow:0 20px 60px #000;display:none;z-index:9;font-size:34px;text-align:center}
#dlg b{display:block;margin:54px 30px 0;font-weight:400;white-space:normal;line-height:1.35}
#dlg i{position:absolute;bottom:40px;width:200px;height:72px;line-height:72px;font-style:normal;cursor:pointer}
/* ---- motion (26 Nov): transforms/opacity only, NOT gated by prefers-reduced-motion (the Paddock kiosk ignores it too; Sansar in-world browser may report reduce). Dev: ?still=1 = no animation. Entrance (.ent) only when the page changes, flashes only on changed prices. */
#stage::before{left:-90px;top:-90px;width:2100px;height:1260px;animation:drift 45s ease-in-out infinite alternate}
#stage::after{content:'';position:absolute;left:-80px;top:-80px;width:2080px;height:1240px;z-index:-1;pointer-events:none;background-image:linear-gradient(#7FD4FF0A 1px,transparent 1px),linear-gradient(90deg,#7FD4FF0A 1px,transparent 1px);background-size:80px 80px;animation:grid 14s linear infinite}
@keyframes drift{from{transform:translate3d(-40px,-20px,0)}to{transform:translate3d(40px,24px,0)}}
@keyframes grid{to{transform:translate3d(80px,80px,0)}}
.tape{position:absolute;left:640px;top:0;width:1220px;height:84px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
.tape .trk{position:absolute;left:0;top:0;height:84px;line-height:84px;font-size:26px;white-space:nowrap;animation:tape 40s linear infinite}
.tape.full{left:0;width:1920px}
.tape .ti{display:inline-block;margin-right:46px}.tape b{font-weight:400;color:var(--lab);letter-spacing:.08em;margin-right:12px}
@keyframes tape{to{transform:translate3d(-50%,0,0)}}
.ent .a{animation:fin .4s ease-out both}
.ent .panel{animation:pin .5s cubic-bezier(.2,.7,.2,1) both}
.ent .rw{animation:rin .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*45ms + 120ms)}
.ent .bar{transform-origin:50% 100%;animation:bgrow .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*35ms + 150ms)}
.ent .btn{animation:bin .45s ease-out both;animation-delay:.15s}
.btn:not(.off):not(.soon){position:absolute;overflow:hidden}
@keyframes fin{from{opacity:0}}
@keyframes pin{from{opacity:0;transform:translate3d(120px,0,0)}}
@keyframes rin{from{opacity:0;transform:translate3d(-48px,0,0)}}
@keyframes bgrow{from{transform:scaleY(.02)}}
@keyframes bin{from{opacity:0;transform:translate3d(0,22px,0)}}
.chip{overflow:hidden}.chv{display:inline-block}
.chip.fu{animation:flu 1s ease-out}.chip.fd{animation:fld 1s ease-out}
.fu .chv{animation:rlu .6s cubic-bezier(.2,.7,.2,1)}.fd .chv{animation:rld .6s cubic-bezier(.2,.7,.2,1)}
@keyframes flu{0%{filter:brightness(1.9);transform:scale(1.08)}100%{filter:none;transform:none}}
@keyframes fld{0%{filter:brightness(1.7);transform:scale(1.08)}100%{filter:none;transform:none}}
@keyframes rlu{from{opacity:0;transform:translate3d(0,70%,0)}}
@keyframes rld{from{opacity:0;transform:translate3d(0,-70%,0)}}
.selb{overflow:hidden;box-shadow:0 0 30px #7FD4FF66,inset 0 0 22px #7FD4FF33}
.ent .selb{animation:fin .4s ease-out both}
.selb.mv{animation:selin .22s ease-out}
@keyframes glw{50%{opacity:.72}}
@keyframes selin{from{opacity:.3;transform:scale(.97,1)}}
#stage .logo{text-shadow:0 0 24px #7FD4FF55;animation:lglow 3.2s ease-in-out infinite}
#stage .touch{animation:breathe 2.2s ease-in-out infinite}
.ent .logo{animation:fin .7s ease-out both,lglow 3.2s ease-in-out .7s infinite}
.ent .touch{animation:bin .6s ease-out .3s both,breathe 2.2s ease-in-out .9s infinite}
.ent .sub{animation:fin .8s ease-out .5s both}
.ring{position:absolute;left:660px;top:250px;width:600px;height:600px;border-radius:50%;border:2px solid #7FD4FF55;pointer-events:none;animation:ring 5s ease-out infinite}
@keyframes lglow{50%{text-shadow:0 0 70px #7FD4FFCC,0 0 18px #BFE9FF88}}
@keyframes breathe{50%{opacity:.35;transform:scale(.97)}}
@keyframes ring{from{opacity:.7;transform:scale(.4)}to{opacity:0;transform:scale(1.7)}}
#dbg{position:fixed;left:6px;top:6px;font:14px monospace;color:#FFB02E;background:#000a;padding:4px 8px;z-index:30;display:none}
#stage{cursor:default;user-select:none;-webkit-user-select:none}   /* 26 Nov owner: no text cursor - nothing on the screen is typed into */

  } else { var f2c = fillBuy(px, k), tot = Math.ceil((q * f2c + D.f * 100) / 100); D.c -= tot; D.h[k] += q; D.cb[k] += tot * 100; D.r = '1|buy|' + q + '|' + tot + '|' + D.f + '|'; }

function press(id) {

    var od = ORDER[D.mf || 0], ps = od.indexOf(D.sel);   // 26 Nov: ▲▼ / page keys walk the SORTED list; key 3 = next sort
    if (id === 'back') go('attract'); else if (id === 'up') D.sel = od[(ps + STOCKS - 1) % STOCKS]; else if (id === 'down') D.sel = od[(ps + 1) % STOCKS]; else if (id === 'pgup') { var pp = Math.floor(ps / 10) - 1; D.sel = od[(pp < 0 ? Math.floor((STOCKS - 1) / 10) : pp) * 10]; } else if (id === 'pgdn') D.sel = od[(Math.floor(ps / 10) + 1) * 10 >= STOCKS ? 0 : (Math.floor(ps / 10) + 1) * 10]; else if (id === 'minus') D.mf = ((D.mf || 0) + 1) % 4;
    else if (id === 'portfolio') { D.sel = 0; go('portfolio'); } else if (id === 'move') go('move'); else if (id === 'select') { D.k = D.sel; go('stock'); }
  } else if (p === 'stock') {
    if (id === 'back') go('market');
    else if (id === 'up') { D.side = 'buy'; D.q = Math.min(1, maxBuy()) || 1; go('amount'); }
    else if (id === 'down') { if (D.h[k] > 0) { D.side = 'sell'; D.q = 1; go('amount'); } else refuse('sell', 'You own no shares of ' + NAMES[k] + ' to sell.'); }
  } else if (p === 'amount') {
    var max = D.side === 'sell' ? D.h[k] : maxBuy(), d = { up: 10, down: -10, minus: -1, plus: 1 }[id];
    if (id === 'back') go('stock'); else if (d) D.q = Math.max(0, Math.min(max, D.q + d));
    else if (id === 'select') { if (D.q < 1) refuse(D.side, 'Pick at least 1 share.'); else if (D.q > max) refuse(D.side, 'Not enough ' + (D.side === 'sell' ? 'shares' : 'free glint') + ' for that amount.'); else go('total'); }
  } else if (p === 'total') {
    if (id === 'back') go('amount'); else if (id === 'select') { showDlg(); return; }

  } else if (p === 'move') {

      if (n < 1) refuse(amt[0], amt[0] === 'in' ? 'The vault has no glint to move in.' : 'No free glint to move out.');

}
function demoMove(kind, n) { if (kind === 'in') { D.b -= n; D.c += n; } else { D.c -= n; D.b += n; } D.r = '1|' + kind + '|0|' + n + '|0|'; D.p = 'result'; }
// demo chat box: same commands as the game (/buy n|max|all /sell n|all|max /in n|all /out n|all); errors = red line (er), never a refusal page
function demoErr(t) { D.er = t; demoWrite(); setTimeout(function () { if (D.er === t) { D.er = ''; demoWrite(); } }, 6000); }
function demoChat(txt) {
  if (!D || pendingYes || D.p === 'wait' || D.p === 'attract') return;
  var w = String(txt).trim().toLowerCase().split(/\s+/), c = w[0];
  if (!/^\/(buy|sell|in|out)$/.test(c)) return;
  var all = w[1] === 'max' || w[1] === 'all', n = /^\d{1,9}$/.test(w[1] || '') ? +w[1] : 0;
  D.er = ''; if (!all && n < 1) { demoErr('type a number: ' + c + ' 50'); return; }
  if (c === '/buy' || c === '/sell') {
    if (D.p !== 'stock' && D.p !== 'amount' && D.p !== 'total') { demoErr('open a stock first'); return; }
    D.side = c === '/buy' ? 'buy' : 'sell'; var max = D.side === 'sell' ? D.h[D.k] : maxBuy();
    if (max < 1) { demoErr(D.side === 'buy' ? 'no free glint to buy with' : 'you own none to sell'); return; }
    if (!all && n > max) { demoErr('max ' + fmt(max) + (max === 1 ? ' share' : ' shares')); return; }

  if (have < 1) { demoErr(kind === 'in' ? 'no banked glint to move in' : 'no free glint to move out'); return; }
  if (!all && n > have) { demoErr('max ' + fmt(have) + ' glint'); return; }

}
function showDlg() {
  var d = document.getElementById('dlg'), k = D.k, sell = D.side === 'sell', px = D.px[k], fill = sell ? fillSell(px, k) : fillBuy(px, k), g = D.q * fill, tot = sell ? Math.floor((g - D.f * 100) / 100) : Math.ceil((g + D.f * 100) / 100);
  d.innerHTML = '<b>' + (sell ? 'Sell ' : 'Buy ') + fmt(D.q) + ' ' + esc(NAMES[k]) + ' at ' + f2(fill) + '?<br>' + (sell ? 'You get ' : 'You pay ') + fmt(tot) + ' glint.</b>' +
    '<i style="left:120px;background:var(--acc);color:#04070F" data-yn="y">Yes</i><i style="right:120px;background:#3A4050;color:#fff" data-yn="n">No</i>';

}
function answer(y) { if (!pendingYes) return; pendingYes = false; var d = document.getElementById('dlg'); if (d) d.style.display = 'none'; if (y) bookNow(); }
function demoAfterRender() { /* dialog is rebuilt by render(); keep it closed unless pending */ if (pendingYes) showDlg(); }
if (DEMO) {
  demoInit();
  stage.addEventListener('click', function (e) {
    var t = e.target; var yn = t.getAttribute && t.getAttribute('data-yn'); if (yn) { answer(yn === 'y'); return; }
    var b = t.closest ? t.closest('.btn') : null; if (b && !b.classList.contains('off') && !b.classList.contains('soon')) press(b.getAttribute('data-slot')); else if (D.p === 'attract') press('select');
  });
  var cb = document.createElement('input'); cb.id = 'chatbox'; cb.placeholder = 'chat: /buy 50 · /sell all · /in 500 · /out all  (Enter)'; cb.autocomplete = 'off';
  cb.style.cssText = 'position:fixed;left:50%;bottom:6px;transform:translateX(-50%);width:min(520px,90vw);z-index:20;font:16px sans-serif;padding:6px 10px;background:#101A33;color:#fff;border:1px solid #7FD4FF;border-radius:6px';
  cb.addEventListener('keydown', function (e) { e.stopPropagation(); if (e.key === 'Enter') { demoChat(cb.value); cb.value = ''; } });
  document.body.appendChild(cb);
  addEventListener('keydown', function (e) {
    var m = { Escape: 'back', ArrowUp: 'up', ArrowDown: 'down', PageUp: 'pgup', PageDown: 'pgdn', '-': 'minus', '+': 'plus', '=': 'plus', Enter: 'select' }[e.key];
    if (e.key === 'P' && e.shiftKey) { D.pz = D.pz ? 0 : 1; demoWrite(); return; }   // demo: Shift+P toggles MARKET PAUSED
    if (pendingYes) { if (e.key === 'y' || e.key === 'Enter') answer(true); else if (e.key === 'n' || e.key === 'Escape') answer(false); return; }
    if (m) { e.preventDefault(); press(m); }
  });
  if (!PLAY) setInterval(demoTick, 30000);   // ?play=1: exchange_play.js runs the clock
  // demo start: honour a starting #p= in the URL (so screenshots can jump to a page), else begin at the attract page
  var sp = (location.hash.match(/p=(\w+)/) || [])[1];
  if (sp && PAGES[sp]) {
    D.p = sp; var m = location.hash.match(/k=(\d+)/); if (m) D.k = +m[1]; m = location.hash.match(/side=(\w+)/); if (m) D.side = m[1]; m = location.hash.match(/q=(\d+)/); if (m) D.q = +m[1];
    m = location.hash.match(/sel=(\d+)/); if (m) D.sel = +m[1];
    if (/[#&]pz=1/.test(location.hash)) D.pz = 1;
    if (sp === 'result') { D.r = ''; var ok = location.hash.match(/res=(\w+)/); if (ok && ok[1] === 'no') refuse('buy', 'Not enough free glint for that amount.'); else { D.q = D.q || 5; D.side = 'buy'; bookNowQuiet(); } }
  }
