<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glintline confirm</title>
<!-- Glintline CONFIRM PLANE page (27 Nov 2026, owner: confirmations = a plane in front of the screen, click it to close).
     Drawn from the #fragment only (no reload): t = title, l = lines joined by |, y = YES label, n = NO label (no y/n = plain notice),
     k = warn (red tab) | ok | info. Left half = NO / CANCEL, right half = YES / CONFIRM (GlintConfirmPlane reads the click side). -->
<style>
@font-face{font-family:Brand;src:url(live/fonts/Cinzel.ttf);font-weight:400 900}
@font-face{font-family:UI;src:url(live/fonts/BarlowSemiCondensed-Bold.ttf)}
:root{--bg:rgb(4,34,38);--tab:rgb(2,20,23);--accent:rgb(255,176,46);--accentRGB:255,176,46;--hi:rgb(255,212,107);--text:rgb(243,251,250);--soft:rgb(158,184,184);--card:rgb(8,52,58);--btnTxt:rgb(10,20,22);--warn:rgb(232,72,60)}
html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:var(--bg);font-family:UI,sans-serif;color:var(--text);overflow:hidden}
#stage::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 70% at 50% 45%,rgba(var(--accentRGB),.14),transparent 70%)}
.abs{position:absolute}
.frame{inset:10px;border:5px solid var(--accent);border-radius:30px;box-sizing:border-box}
.tab{left:0;top:0;width:1280px;height:120px;background:var(--tab);border-bottom:4px solid var(--accent)}
.warn .tab{background:var(--warn);border-bottom-color:var(--warn)}
.title{left:0;top:30px;width:1280px;text-align:center;font:700 54px Brand;letter-spacing:.24em;color:var(--hi);white-space:nowrap}
.warn .title{color:#fff}
.lines{left:80px;top:170px;width:1120px;text-align:center}
.line{font-size:46px;line-height:64px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line.soft{color:var(--soft);font-size:38px}
.btn{top:560px;height:120px;border-radius:26px;box-sizing:border-box;font-size:52px;letter-spacing:.22em;text-align:center;line-height:116px;white-space:nowrap}
.no{left:60px;width:540px;background:rgba(2,20,23,.9);border:4px solid rgba(var(--accentRGB),.63);color:var(--text)}
.yes{left:680px;width:540px;background:var(--accent);color:var(--btnTxt);animation:pulse 2.6s ease-in-out infinite}
.close{left:340px;width:600px;background:var(--accent);color:var(--btnTxt);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:inset 0 0 0 rgba(255,255,255,0)}50%{box-shadow:inset 0 0 36px rgba(255,255,255,.6)}}
.in{animation:pop .28s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:.2}to{transform:scale(1);opacity:1}}
</style></head>
<body><div id="stage"></div>
<script>
var S = document.getElementById('stage');
function fit() { var k = Math.min(innerWidth / 1280, innerHeight / 720); S.style.transform = 'scale(' + k + ')'; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function draw() {
  var q = new URLSearchParams(location.hash.slice(1));
  var t = q.get('t') || '', l = (q.get('l') || '').split('|').filter(function (x) { return x.length; }), y = q.get('y'), n = q.get('n'), k = q.get('k') || 'info';
  var h = '<div class="abs tab"></div><div class="abs title">' + esc(t) + '</div><div class="abs lines">';
  l.forEach(function (x, i) { h += '<div class="line' + (i > 0 && i === l.length - 1 && l.length > 2 ? ' soft' : '') + '">' + esc(x) + '</div>'; });
  h += '</div>';
  if (y) h += '<div class="abs btn no">' + esc(n || 'CANCEL') + '</div><div class="abs btn yes">' + esc(y) + '</div>';
  else h += '<div class="abs btn close">' + esc(n || 'CLOSE') + '</div>';
  h += '<div class="abs frame"></div>';
  S.className = k === 'warn' ? 'warn' : ''; S.innerHTML = '<div class="abs in" style="inset:0">' + h + '</div>';
}
addEventListener('resize', fit); addEventListener('hashchange', draw); fit(); draw();
</script></body></html>
