<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KB7 Forktail Viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b1316; --panel:rgba(14,30,34,.82); --line:#2a4a50; --gold:#d9b46a; --text:#e8eef0; --dim:#9fb3b8; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:14px/1.4 Inter,system-ui,sans-serif; overflow:hidden; }
  #view { position:fixed; inset:0; }
  header { position:fixed; top:16px; left:16px; right:16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; pointer-events:none; }
  header > * { pointer-events:auto; }
  h1 { font:600 18px Cinzel,serif; letter-spacing:.12em; color:var(--gold); margin:0 12px 0 0; }
  .grp { display:flex; border:1px solid var(--line); background:var(--panel); }
  button { background:none; border:0; color:var(--dim); font:600 13px Inter,sans-serif; padding:8px 14px; cursor:pointer; letter-spacing:.06em; }
  button + button { border-left:1px solid var(--line); }
  button.on { color:#0b1316; background:var(--gold); }
  #info { position:fixed; left:16px; right:16px; bottom:16px; max-width:560px; padding:12px 14px; background:var(--panel); border:1px solid var(--line); }
  #info b { color:var(--gold); font-family:Cinzel,serif; letter-spacing:.08em; }
  #hint { color:var(--dim); font-size:12px; margin-top:4px; }
  #load { position:fixed; inset:0; display:grid; place-items:center; color:var(--dim); pointer-events:none; }
  .tag { position:fixed; transform:translate(-50%,0); font:600 14px Cinzel,serif; color:var(--gold); letter-spacing:.1em; pointer-events:none; text-shadow:0 1px 4px #000; }
</style>
</head>
<body>
<div id="view"></div>
<header>
  <h1>KB7 FORKTAIL</h1>
  <div class="grp" id="vers">
    <button data-v="v2" class="on">V2</button><button data-v="v4">V4</button><button data-v="v5">V5</button><button data-v="v6">V6</button><button data-v="v7">V7</button><button data-v="v8">V8</button><button data-v="v9">V9</button><button data-v="v10">V10</button><button data-v="v11">V11</button><button data-v="v12">V12</button><button data-v="cmp">V11 | V12</button><button data-v="all">ALL</button>
  </div>
  <div class="grp"><button id="gear">GEAR UP</button><button id="wire">WIREFRAME</button><button id="reset">RESET VIEW</button></div>
</header>
<div id="info"><div id="label"></div><div id="hint">Drag = turn · scroll / pinch = zoom · right-drag / two fingers = move</div></div>
<div id="load">Loading ships…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const LABELS = {
  v2:  '<b>V2</b> — the shape you liked: twin booms, deep cargo hold, ring-ducted engines, glass nose.',
  v4:  '<b>V4</b> — V2 shape + detail: faceted engine shrouds, fillets, side sponsons, armour layers, deeper hatches.',
  v5:  '<b>V5</b> — sculpted main body: the hull section changes along the ship, waist at the wing, spine hump, nose strakes into the wing roots.',
  v6:  '<b>V6 · BOLD SCULPT</b> — deep waist at the wing, tall hump over the cargo hold, high prow with a keel blade, taller fins.',
  v7:  '<b>V7 · STEALTH FACETS</b> — sharp tent-shaped sections, long wedge nose, leaning armour facets, steep canted fins, cut wing tips.',
  v8:  '<b>V8 · INDUSTRIAL HAULER</b> — frame ribs around the hold, saddle tanks on top, cargo pods under the wings, wheels and a ladder.',
  v9:  '<b>V9 · ORGANIC FLOW</b> — oval body, big blended wing roots, gull wing with tip pods, booms that sweep up to the tail, round engines.',
  v10: '<b>V10 · PREMIUM SLEEK</b> — long sharp nose, slim low body, swept-back wing tips, slim booms, gold beltline nose to ramp.',
  v11: '<b>V11 · SMOOTH HARD-SURFACE</b> — the V10 shape with flowing curved skins, crisp chine lines from nose to ramp and along the booms, panel grooves that follow the curve, round engines.',
  v12: '<b>V12 · THIN CANOPY BOW</b> — V11 with the gold band over the cockpit cut from ~17 cm to a thin 2 cm bow, so you see much more glass. Everything else unchanged.',
  cmp: '<b>V11 | V12</b> — same ship: V11 (left) has the wide gold band over the cockpit, V12 (right) only a thin bow - more glass.',
  all: '<b>ALL</b> — every version, same light and scale. Top row V2 · V4 · V5 · V6 · V7, bottom row V8 · V9 · V10 · V11 · V12.'
};
const VERS = ['v2', 'v4', 'v5', 'v6', 'v7', 'v8', 'v9', 'v10', 'v11', 'v12'];

const el = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
el.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1316);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const key = new THREE.DirectionalLight(0xfff4e8, 2.2); key.position.set(5, 8, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0xcfe4ff, 1.2); rim.position.set(-6, 4, -8); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xdde8ec, 0x1a2224, 0.6));
const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 64), new THREE.MeshStandardMaterial({ color: 0x111c1f, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

const camera = new THREE.PerspectiveCamera(35, 1, 0.05, 500);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const ships = {};
const loader = new GLTFLoader();
const BUST = new URLSearchParams(location.search).get('v') || Date.now();   // fresh glbs, never a cached old version
await Promise.all(VERS.map(v => new Promise((ok, bad) => loader.load(`kb7/kb7_${v}.glb?v=${BUST}`, g => {
  const root = g.scene;
  const box = new THREE.Box3().setFromObject(root), c = box.getCenter(new THREE.Vector3());
  root.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));        // centre on floor
  const holder = new THREE.Group(); holder.add(root); holder.userData.size = box.getSize(new THREE.Vector3());
  scene.add(holder); ships[v] = holder; ok();
}, undefined, bad))));
document.getElementById('load').remove();

const tags = {};
for (const v of VERS) { const t = document.createElement('div'); t.className = 'tag'; t.textContent = v.toUpperCase(); document.body.appendChild(t); tags[v] = t; }

let mode = 'v2', wire = false;
function frame(w, h, d) {
  const r = Math.max(w, h, d) * 0.5;
  const dist = r / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * (camera.aspect < 1 ? 1.6 : 1.05);
  controls.target.set(0, h * 0.4, 0);
  camera.position.set(dist * 0.62, dist * 0.42, -dist * 0.66);   // nose-side 3/4
  controls.update();
}
function show(m) {
  mode = m;
  document.querySelectorAll('#vers button').forEach(b => b.classList.toggle('on', b.dataset.v === m));
  document.getElementById('label').innerHTML = LABELS[m];
  const gap = Math.max(...VERS.map(v => ships[v].userData.size.x)) * 1.12;
  const row = Math.max(...VERS.map(v => ships[v].userData.size.z)) * 1.15;
  const multi = m === 'all' || m === 'cmp';
  VERS.forEach((v, i) => {
    const inCmp = v === 'v11' || v === 'v12';
    ships[v].visible = m === 'all' || m === v || (m === 'cmp' && inCmp);
    if (m === 'all') {                                 // 5 + 4 grid, reads left to right from the nose-side camera; top row = far row
      ships[v].position.x = (2 - (i % 5)) * gap; ships[v].position.z = (i < 5 ? 0.5 : -0.5) * row;
    } else if (m === 'cmp' && inCmp) {
      ships[v].position.x = (v === 'v11' ? 0.5 : -0.5) * gap; ships[v].position.z = 0;
    } else ships[v].position.set(0, 0, 0);
    tags[v].style.display = multi && ships[v].visible ? '' : 'none';
  });
  const s = ships.v2.userData.size;
  if (m === 'cmp') frame(gap * 2, s.y, s.z);
  else if (m === 'all') {                              // straight nose-on from above: columns read left to right, rows top/bottom
    const d = gap * 5 * 0.5 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / Math.min(camera.aspect, 2) * 1.55;
    controls.target.set(0, s.y * 0.3, 0); camera.position.set(0, d * 0.85, -d * 0.75); controls.update();
  }
  else frame(s.x, s.y, s.z);
}
function setWire(on) {
  wire = on; document.getElementById('wire').classList.toggle('on', on);
  VERS.forEach(v => ships[v].traverse(o => { if (o.isMesh) [].concat(o.material).forEach(mt => mt.wireframe = on); }));
}
document.querySelectorAll('#vers button').forEach(b => b.onclick = () => show(b.dataset.v));
document.getElementById('wire').onclick = () => setWire(!wire);
// landing gear (owner 25 Nov): ships built with gear nodes carry <key>_gear_down (struts, wheels, open doors) and
// <key>_gear_doors (closed doors flush under the hull). Older versions have none and are not touched.
let gearUp = false;
function setGear(up) {
  gearUp = up; const b = document.getElementById('gear'); b.textContent = up ? 'GEAR DOWN' : 'GEAR UP'; b.classList.toggle('on', up);
  VERS.forEach(v => ships[v].traverse(o => {
    if (/_gear_down$/.test(o.name)) o.visible = !up;
    if (/_gear_doors$/.test(o.name)) o.visible = up;
  }));
}
document.getElementById('gear').onclick = () => setGear(!gearUp);
setGear(false);
document.getElementById('reset').onclick = () => show(mode);

function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', () => { resize(); show(mode); });
resize(); show('cmp');

const p = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  controls.update(); renderer.render(scene, camera);
  if (mode === 'all' || mode === 'cmp') VERS.forEach(v => {
    const s = ships[v].userData.size; p.set(ships[v].position.x, s.y * 1.15, ships[v].position.z).project(camera);
    tags[v].style.left = (p.x * 0.5 + 0.5) * innerWidth + 'px'; tags[v].style.top = (-p.y * 0.5 + 0.5) * innerHeight + 'px';
  });
});
</script>
</body>
</html>
